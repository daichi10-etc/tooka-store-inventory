<script>

  // =====================================================
  // API BACKEND TOOKA V1.5
  // =====================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxv3ocJD6hDQHb9Q85oAYjkaK6RxUpJWeLRYpxm4jXoEmH-ata8ReP6sjb3pbFchgkb/exec";


  // =====================================================
  // MASTER PRODUK
  // =====================================================

  let produkMaster = [];

  let produkLoaded = false;

  let produkLoading = false;


  async function loadProduk() {

    if (produkLoaded) {
      return produkMaster;
    }


    if (produkLoading) {

      while (produkLoading) {

        await new Promise(
          resolve => setTimeout(resolve, 100)
        );

      }

      return produkMaster;

    }


    produkLoading = true;


    try {

      const hasil =
        await apiRequest({
          action: "PRODUK"
        });


      if (
        !hasil ||
        hasil.success !== true
      ) {

        throw new Error(
          hasil && hasil.message
            ? hasil.message
            : "Master produk gagal dimuat."
        );

      }


      produkMaster =
        Array.isArray(hasil.data)
          ? hasil.data
          : [];


      produkLoaded = true;


      return produkMaster;


    } finally {

      produkLoading = false;

    }

  }


  // =====================================================
  // FORMAT RUPIAH
  // =====================================================

  function formatRupiah(value) {

    const number =
      Number(value || 0);


    return number.toLocaleString(
      "id-ID",
      {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }
    );

  }


  // =====================================================
  // SHOW PRODUCT RESULTS
  // =====================================================

  function showProdukResults(type) {

    const results =
      document.getElementById(
        type + "ProdukResults"
      );


    if (!results) {
      return;
    }


    filterProduk(type);

  }


  // =====================================================
  // FILTER PRODUK
  // =====================================================

  async function filterProduk(type) {

    const searchInput =
      document.getElementById(
        type + "ProdukCari"
      );


    const results =
      document.getElementById(
        type + "ProdukResults"
      );


    if (
      !searchInput ||
      !results
    ) {

      return;

    }


    const keyword =
      searchInput.value
        .trim()
        .toLowerCase();


    results.classList.add(
      "show"
    );


    try {

      const products =
        await loadProduk();


      const filtered =
        products
          .filter(product => {

            const id =
              String(
                product.id || ""
              )
              .toLowerCase();


            const nama =
              String(
                product.nama || ""
              )
              .toLowerCase();


            const kategori =
              String(
                product.kategori || ""
              )
              .toLowerCase();


            return (
              !keyword ||
              id.includes(keyword) ||
              nama.includes(keyword) ||
              kategori.includes(keyword)
            );

          })
          .slice(
            0,
            50
          );


      if (
        filtered.length === 0
      ) {

        results.innerHTML =
          '<div class="product-empty">Produk tidak ditemukan.</div>';

        return;

      }


      results.innerHTML =
        filtered
          .map(
            product => `

              <div
                class="product-option"
                onclick="selectProduk(
                  '${type}',
                  '${escapeJs(product.id)}'
                )"
              >

                <strong>
                  ${escapeHtml(product.id)}
                  —
                  ${escapeHtml(product.nama)}
                </strong>

                <span>
                  ${escapeHtml(
                    product.kategori ||
                    "Tanpa kategori"
                  )}
                  ·
                  ${escapeHtml(
                    product.satuan ||
                    "-"
                  )}
                  ·
                  ${formatRupiah(
                    product.hargaJual || 0
                  )}
                </span>

              </div>

            `
          )
          .join("");


    } catch (error) {

      results.innerHTML =
        '<div class="product-empty">Gagal memuat master produk.</div>';

    }

  }


  // =====================================================
  // SELECT PRODUK
  // =====================================================

  function selectProduk(
    type,
    produkId
  ) {

    const product =
      produkMaster.find(
        item =>
          String(
            item.id
          )
          .trim()
          .toUpperCase() ===
          String(
            produkId
          )
          .trim()
          .toUpperCase()
      );


    if (!product) {
      return;
    }


    const hiddenInput =
      document.getElementById(
        type + "Produk"
      );


    const searchInput =
      document.getElementById(
        type + "ProdukCari"
      );


    const results =
      document.getElementById(
        type + "ProdukResults"
      );


    const info =
      document.getElementById(
        type + "ProdukInfo"
      );


    if (hiddenInput) {

      hiddenInput.value =
        product.id;

    }


    if (searchInput) {

      searchInput.value =
        product.id +
        " — " +
        product.nama;

    }


    // ===================================================
    // INFO PRODUK V1.5
    // ===================================================

    if (info) {

      info.innerHTML = `

        Satuan:
        <strong>
          ${escapeHtml(
            product.satuan || "-"
          )}
        </strong>

        · Minimum stok:
        <strong>
          ${formatNumber(
            product.stokMinimum || 0
          )}
        </strong>

        · Harga jual:
        <strong>
          ${escapeHtml(
            formatRupiah(
              product.hargaJual || 0
            )
          )}
        </strong>

      `;

    }


    // ===================================================
    // HARGA OTOMATIS BARANG KELUAR
    // ===================================================

    if (
      type === "keluar"
    ) {

      const hargaInput =
        document.getElementById(
          "keluarHarga"
        );


      if (hargaInput) {

        hargaInput.value =
          Number(
            product.hargaJual || 0
          );

      }

    }


    // ===================================================
    // HARGA BARANG MASUK TETAP MANUAL
    // ===================================================

    // Sengaja tidak mengisi masukHarga.
    //
    // Harga Jual = harga ke konsumen.
    // Harga Masuk = harga beli aktual dari supplier.
    //
    // Jadi keduanya tidak boleh otomatis disamakan.


    if (results) {

      results.innerHTML = "";

      results.classList.remove(
        "show"
      );

    }

  }


  // =====================================================
  // ESCAPE HTML
  // =====================================================

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

  }


  // =====================================================
  // ESCAPE JS
  // =====================================================

  function escapeJs(value) {

    return String(
      value ?? ""
    )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

  }


  // =====================================================
  // TUTUP PRODUCT DROPDOWN
  // =====================================================

  document.addEventListener(
    "click",
    function(event) {

      if (
        !event.target.closest(
          ".product-picker"
        )
      ) {

        document
          .querySelectorAll(
            ".product-results"
          )
          .forEach(
            element =>
              element.classList.remove(
                "show"
              )
          );

      }

    }
  );


  // =====================================================
  // NAVIGASI
  // =====================================================

  function showPage(
    pageId,
    button
  ) {

    document
      .querySelectorAll(
        ".page"
      )
      .forEach(
        page =>
          page.classList.remove(
            "active"
          )
      );


    const page =
      document.getElementById(
        pageId
      );


    if (!page) {
      return;
    }


    page.classList.add(
      "active"
    );


    document
      .querySelectorAll(
        ".nav-btn"
      )
      .forEach(
        btn =>
          btn.classList.remove(
            "active"
          )
      );


    if (button) {

      button.classList.add(
        "active"
      );

    }


    if (
      pageId ===
      "dashboard"
    ) {

      loadDashboardStock();

    }

  }


  // =====================================================
  // REQUEST API
  // =====================================================

  async function apiRequest(data) {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(data)
        }
      );


    if (!response.ok) {

      throw new Error(
        "Server API gagal merespons. HTTP " +
        response.status
      );

    }


    const text =
      await response.text();


    try {

      return JSON.parse(
        text
      );

    } catch (error) {

      throw new Error(
        "Response API tidak valid: " +
        text
      );

    }

  }


  // =====================================================
  // STATUS
  // =====================================================

  function showStatus(
    elementId,
    message,
    type
  ) {

    const element =
      document.getElementById(
        elementId
      );


    if (!element) {
      return;
    }


    element.textContent =
      message || "";


    element.className =
      "status show " +
      (
        type === "loading"
          ? "loading"
          : type
            ? type
            : "error"
      );

  }


  // =====================================================
  // BUTTON LOCK
  // =====================================================

  function lockButton(
    buttonId,
    text
  ) {

    const button =
      document.getElementById(
        buttonId
      );


    if (!button) {
      return;
    }


    button.disabled =
      true;


    button.dataset.originalText =
      button.textContent;


    button.textContent =
      text ||
      "MENYIMPAN...";

  }


  function unlockButton(
    buttonId
  ) {

    const button =
      document.getElementById(
        buttonId
      );


    if (!button) {
      return;
    }


    button.disabled =
      false;


    if (
      button.dataset.originalText
    ) {

      button.textContent =
        button.dataset.originalText;

    }

  }


  // =====================================================
  // RESET PRODUCT
  // =====================================================

  function resetProductPicker(
    type
  ) {

    const search =
      document.getElementById(
        type + "ProdukCari"
      );


    const hidden =
      document.getElementById(
        type + "Produk"
      );


    const info =
      document.getElementById(
        type + "ProdukInfo"
      );


    const results =
      document.getElementById(
        type + "ProdukResults"
      );


    if (search) {
      search.value = "";
    }


    if (hidden) {
      hidden.value = "";
    }


    if (info) {
      info.textContent = "";
    }


    if (results) {

      results.innerHTML =
        "";

      results.classList.remove(
        "show"
      );

    }

  }


  // =====================================================
  // RESET FORM MASUK
  // =====================================================

  function resetFormMasuk() {

    resetProductPicker(
      "masuk"
    );


    document.getElementById(
      "masukQty"
    ).value = "";


    document.getElementById(
      "masukHarga"
    ).value = "";


    document.getElementById(
      "masukSumber"
    ).value =
      "SUPPLIER";


    document.getElementById(
      "masukUser"
    ).value =
      "OWNER";


    document.getElementById(
      "masukKeterangan"
    ).value = "";

  }


  // =====================================================
  // RESET FORM KELUAR
  // =====================================================

  function resetFormKeluar() {

    resetProductPicker(
      "keluar"
    );


    document.getElementById(
      "keluarQty"
    ).value = "";


    document.getElementById(
      "keluarHarga"
    ).value = "";


    document.getElementById(
      "keluarTujuan"
    ).value =
      "KONSUMEN";


    document.getElementById(
      "keluarUser"
    ).value =
      "OWNER";


    document.getElementById(
      "keluarKeterangan"
    ).value = "";

  }


  // =====================================================
  // RESET FORM TRANSFER
  // =====================================================

  function resetFormTransfer() {

    resetProductPicker(
      "transfer"
    );


    document.getElementById(
      "transferQty"
    ).value = "";


    document.getElementById(
      "transferAsal"
    ).value =
      "LOC001";


    document.getElementById(
      "transferTujuan"
    ).value =
      "LOC002";


    document.getElementById(
      "transferUser"
    ).value =
      "OWNER";

  }


  // =====================================================
  // BARANG MASUK
  // =====================================================

  let sedangMasuk =
    false;


  async function barangMasuk() {

    if (
      sedangMasuk
    ) {

      return;

    }


    const produkId =
      document.getElementById(
        "masukProduk"
      ).value.trim();


    const lokasiId =
      document.getElementById(
        "masukLokasi"
      ).value;


    const qty =
      Number(
        document.getElementById(
          "masukQty"
        ).value
      );


    const harga =
      Number(
        document.getElementById(
          "masukHarga"
        ).value ||
        0
      );


    const sumber =
      document.getElementById(
        "masukSumber"
      ).value;


    const user =
      document.getElementById(
        "masukUser"
      ).value;


    const keterangan =
      document.getElementById(
        "masukKeterangan"
      ).value.trim();


    if (!produkId) {

      showStatus(
        "statusMasuk",
        "Produk wajib dipilih.",
        "error"
      );

      return;

    }


    if (
      !qty ||
      qty <= 0
    ) {

      showStatus(
        "statusMasuk",
        "Qty harus lebih dari 0.",
        "error"
      );

      return;

    }


    sedangMasuk =
      true;


    lockButton(
      "btnMasuk",
      "MENYIMPAN..."
    );


    showStatus(
      "statusMasuk",
      "Sedang menyimpan barang masuk...",
      "loading"
    );


    try {

      const hasil =
        await apiRequest({

          action:
            "MASUK",

          produkId:
            produkId,

          lokasiId:
            lokasiId,

          qty:
            qty,

          user:
            user,

          tujuan:
            sumber,

          harga:
            harga,

          keterangan:
            keterangan

        });


      if (
        !hasil ||
        hasil.success !==
          true
      ) {

        throw new Error(
          hasil &&
          hasil.message
            ? hasil.message
            : "Barang masuk gagal disimpan."
        );

      }


      showStatus(
        "statusMasuk",
        hasil.message ||
          "Barang masuk berhasil disimpan.",
        "success"
      );


      resetFormMasuk();


      loadDashboardStock();


    } catch (error) {

      showStatus(
        "statusMasuk",
        error.message ||
          "Barang masuk gagal disimpan.",
        "error"
      );

    } finally {

      sedangMasuk =
        false;


      unlockButton(
        "btnMasuk"
      );

    }

  }


  // =====================================================
  // BARANG KELUAR
  // =====================================================

    ) {

    const qty =

          "keluarQty"
        ).value
      );

        document.getElementById(
          "keluarHarga"
        ).value ||
        0
      );


    const tujuan =
      document.getElementById(
        "keluarTujuan"
      ).value;


    const user =
      document.getElementById(
        "keluarUser"
      ).value;


    const keterangan =
      document.getElementById(
        "keluarKeterangan"
      ).value.trim();


    if (!produkId) {

      showStatus(
        "statusKeluar",
        "Produk wajib dipilih.",

      );

    }


    if (
      !qty ||
      qty <= 0
    ) {

      showStatus(
        "statusKeluar",
        "Qty harus lebih dari 0.",

      );

      return;

    }


    sedangKeluar =
      true;


    lockButton(
      "btnKeluar",
      "MENYIMPAN..."
    );


    showStatus(
      "statusKeluar",
      "Sedang menyimpan barang keluar...",
      "loading"
    );


    try {

      const hasil =
        await apiRequest({

          action:
            "KELUAR",

          produkId:
            produkId,

          lokasiId:
            lokasiId,

          qty:
            qty,

          user:
            user,

          tujuan:
            tujuan,

          harga:
            harga,

          keterangan:
            keterangan

        });


      if (
        !hasil ||
        hasil.success !==
          true
      ) {

        throw new Error(
          hasil &&
          hasil.message
            ? hasil.message
            : "Barang keluar gagal disimpan."
        );

      }


      const stokSisa =
        hasil.data &&
        hasil.data.stokSisa !==
          undefined
          ? " Stok sisa: " +
            hasil.data.stokSisa
          : "";


      showStatus(
        "statusKeluar",
        (
          hasil.message ||
          "Barang keluar berhasil disimpan."
        ) +
        stokSisa,
        "success"
      );

      loadDashboardStock();


    } catch (error) {

      showStatus(
        "statusKeluar",
        error.message ||
          "Barang keluar gagal disimpan.",
        "error"
      );

    } finally {

      sedangKeluar =
        false;

      );

  }


  // =====================================================
  // TRANSFER
  // =====================================================

  let sedangTransfer =
    false;


  async function transferBarang() {

    if (
      sedangTransfer
    ) {

      return;

    }


    const produkId =
      document.getElementById(
        "transferProduk"
      ).value.trim();


    const qty =
      Number(
        document.getElementById(
          "transferQty"
        ).value
      );


    const lokasiAsal =
      document.getElementById(
        "transferAsal"
      ).value;


    const lokasiTujuan =
      document.getElementById(
        "transferTujuan"
      ).value;


    const user =
      document.getElementById(
        "transferUser"
      ).value;


    if (!produkId) {

      showStatus(
        "statusTransfer",
        "Produk wajib dipilih.",
        "error"
      );

    }


    if (
      !qty ||
      qty <= 0
    ) {

      showStatus(
        "statusTransfer",
        "Qty harus lebih dari 0.",
        "error"
      );

      return;

    }


    if (
      lokasiAsal ===
      lokasiTujuan
    ) {

      showStatus(
        "statusTransfer",
        "Lokasi asal dan tujuan tidak boleh sama.",
        "error"
      );

      return;

    }


    sedangTransfer =
      true;


    lockButton(
      "btnTransfer",
      "MEMPROSES..."
    );


    showStatus(
      "statusTransfer",
      "Sedang memproses transfer...",
      "loading"
    );


    try {

      const hasil =
        await apiRequest({

          action:
            "TRANSFER",

          produkId:
            produkId,

          lokasiAsal:
            lokasiAsal,

          lokasiTujuan:
            lokasiTujuan,

          qty:
            qty,

          user:
            user

        });

        !hasil ||
        hasil.success !==

      ) {

        throw new Error(
          hasil &&

            ? hasil.message
            : "Transfer gagal disimpan."
        );

      }


      showStatus(
        "statusTransfer",
        hasil.message ||
          "Transfer berhasil disimpan.",
        "success"
      );


      resetFormTransfer();


      loadDashboardStock();


    } catch (error) {

      showStatus(
        "statusTransfer",
        error.message ||
          "Transfer gagal disimpan.",
        "error"
      );

    } finally {

      sedangTransfer =
        false;


      unlockButton(
        "btnTransfer"
      );

    }

  }


  // =====================================================
  // CEK STOK
  // =====================================================

  let sedangCekStok =
    false;


  async function cekStok() {

    if (
      sedangCekStok
    ) {

      return;

    }


    const produkId =
      document.getElementById(
        "stokProduk"
      ).value.trim();


    const lokasiId =
      document.getElementById(
        "stokLokasi"
      ).value;


    document.getElementById(
      "hasilStok"
    ).innerHTML =
      "";


    if (!produkId) {

      showStatus(
        "statusStok",
        "Produk wajib dipilih.",
        "error"
      );

      return;

    }


    sedangCekStok =
      true;


    lockButton(
      "btnStok",
      "MEMERIKSA..."
    );


    showStatus(
      "statusStok",
      "Sedang mengambil data stok...",
      "loading"
    );


    try {

      const hasil =
        await apiRequest({

          action:
            "STOK",

          produkId:
            produkId,

          lokasiId:
            lokasiId

        });


      if (
        !hasil ||
        hasil.success !==
          true
      ) {

        throw new Error(
          hasil &&
          hasil.message
            ? hasil.message
            : "Data stok tidak ditemukan."
        );

      }


      let dataList =
        [];


      if (
        Array.isArray(
          hasil.data
        )
      ) {

        dataList =
          hasil.data;

      } else if (
        hasil.data &&
        typeof hasil.data ===
          "object"
      ) {

        dataList =
          [hasil.data];

      }


      if (
        dataList.length ===
        0
      ) {

        throw new Error(
          "Data stok tidak ditemukan."
        );

      }


      const produkCari =
        String(
          produkId
        )
        .trim()
        .toUpperCase();


      const lokasiCari =
        String(
          lokasiId
        )
        .trim()
        .toUpperCase();


      let data =
        dataList.find(
          item => {

            if (
              !item ||
              typeof item !==
                "object"
            ) {

              return false;

            }


            const itemProduk =
              String(
                item.produkId ??
                item.idProduk ??
                item.ID_PRODUK ??
                item.ID ??
                ""
              )
              .trim()
              .toUpperCase();


            const itemLokasi =
              String(
                item.lokasiId ??
                item.idLokasi ??
                item.LOKASI_ID ??
                ""
              )
              .trim()
              .toUpperCase();


            return (
              itemProduk ===
                produkCari &&
              itemLokasi ===
                lokasiCari
            );

          }
        );


      if (
        !data &&
        dataList.length ===
          1
      ) {

        const item =
          dataList[0];


        const itemProduk =
          String(
            item.produkId ??
            item.idProduk ??
            item.ID_PRODUK ??
            item.ID ??
            ""
          )
          .trim()
          .toUpperCase();


        if (
          itemProduk ===
          produkCari
        ) {

          data =
            item;

        }

      }


      if (!data) {

        throw new Error(
          "Stok untuk produk dan lokasi tersebut tidak ditemukan."
        );

      }


      const nama =
        data.nama ??
        data.namaProduk ??
        data.produkNama ??
        data.NAMA_PRODUK ??
        data.produk ??
        data.produkId ??
        produkId;


      const tampilProduk =
        data.produkId ??
        data.idProduk ??
        data.ID_PRODUK ??
        produkId;


      const tampilLokasi =
        data.lokasi ??
        data.namaLokasi ??
        data.lokasiNama ??
        data.LOKASI ??
        data.lokasiId ??
        data.idLokasi ??
        lokasiId;


      const stok =
        data.stok ??
        data.stock ??
        data.STOK ??
        data.qty ??
        data.QTY ??
        0;


      const satuan =
        data.satuan ??
        data.unit ??
        data.SATUAN ??
        "";


      const minimum =
        data.minimum ??
        data.stokMinimum ??
        0;


      const hargaJual =
        data.hargaJual ??
        0;


      document.getElementById(
        "hasilStok"
      ).innerHTML = `

        <div class="lokasi-card">

          <h3>
            ${escapeHtml(
              nama
            )}
          </h3>

          <div class="muted">
            ${escapeHtml(
              tampilProduk
            )}
          </div>

          <div class="muted">
            ${escapeHtml(
              tampilLokasi
            )}
          </div>

          <div class="stok-number">
            ${escapeHtml(
              formatNumber(stok)
            )}
          </div>

          <div class="muted">
            ${escapeHtml(
              satuan
            )}
          </div>

          <div
            class="muted"
            style="margin-top:8px;"
          >
            Minimum:
            <strong>
              ${escapeHtml(
                formatNumber(minimum)
              )}
            </strong>
          </div>

          <div
            class="muted"
            style="margin-top:5px;"
          >
            Harga Jual:
            <strong>
              ${escapeHtml(
                formatRupiah(
                  hargaJual
                )
              )}
            </strong>
          </div>

        </div>

      `;


      showStatus(
        "statusStok",
        "Stok berhasil ditemukan.",
        "success"
      );


    } catch (error) {

      showStatus(
        "statusStok",
        error.message ||
          "Gagal mengambil data stok.",
        "error"
      );


      document.getElementById(
        "hasilStok"
      ).innerHTML =
        "";

    } finally {

      sedangCekStok =
        false;


      unlockButton(
        "btnStok"
      );

    }

  }


  // =====================================================
  // STATUS STOK
  // =====================================================

  function tentukanStatusStok(
    stok,
    minimum
  ) {

    const stokAngka =
      Number(
        stok || 0
      );


    const minimumAngka =
      Number(
        minimum || 0
      );


    if (
      minimumAngka <=
      0
    ) {

      return {

        text:
          "TIDAK DIPANTAU",

        icon:
          "⚪",

        className:
          "stock-status-warning"

      };

    }


    if (
      stokAngka <=
      0
    ) {

      return {

        text:
          "HABIS",

        icon:
          "🔴",

        className:
          "stock-status-danger"

      };

    }


    if (
      stokAngka <=
      minimumAngka
    ) {

      return {

        text:
          "STOK MENIPIS",

        icon:
          "🟠",

        className:
          "stock-status-warning"

      };

    }


    return {

      text:
        "AMAN",

      icon:
        "🟢",

      className:
        "stock-status-safe"

    };

  }


  // =====================================================
  // FORMAT ANGKA
  // =====================================================

  function formatNumber(
    value
  ) {

    const number =
      Number(
        value || 0
      );


    if (
      Number.isInteger(
        number
      )
    ) {

      return String(
        number
      );

    }


    return number.toLocaleString(
      "id-ID",
      {
        maximumFractionDigits:
          2
      }
    );

  }


  // =====================================================
  // NAMA LOKASI
  // =====================================================

  function namaLokasi(
    lokasiId
  ) {

    const id =
      String(
        lokasiId || ""
      )
      .trim()
      .toUpperCase();


    if (
      id ===
      "LOC001"
    ) {

      return "TOOKA HUB METRO";

    }


    if (
      id ===
      "LOC002"
    ) {

      return "TOOKA STORE JEPARA";

    }


    return (
      lokasiId ||
      "-"
    );

  }


  // =====================================================
  // DASHBOARD STOCK WARNING
  // =====================================================

  let dashboardStockLoading =
    false;


  async function loadDashboardStock() {

    if (
      dashboardStockLoading
    ) {

      return;

    }


    const box =
      document.getElementById(
        "dashboardStock"
      );


    const summary =
      document.getElementById(
        "dashboardStockSummary"
      );


    const content =
      document.getElementById(
        "dashboardStockContent"
      );


    if (
      !box ||
      !summary ||
      !content
    ) {

      return;

    }


    dashboardStockLoading =
      true;


    box.className =
      "dashboard-stock";


    summary.innerHTML =
      "";


    content.innerHTML =
      '<div class="dashboard-loading">Memeriksa kondisi stok...</div>';


    try {

      const products =
        await loadProduk();


      const hasil =
        await apiRequest({

          action:
            "STOK"

        });


      if (
        !hasil ||
        hasil.success !==
          true
      ) {

        throw new Error(
          hasil &&
          hasil.message
            ? hasil.message
            : "Data stok dashboard gagal dimuat."
        );

      }


      const dataList =
        Array.isArray(
          hasil.data
        )
          ? hasil.data
          : [];


      const productMap =
        new Map();


      products.forEach(
        product => {

          const id =
            String(
              product.id || ""
            )
            .trim()
            .toUpperCase();


          if (id) {

            productMap.set(
              id,
              product
            );

          }

        }
      );


      const perhatian =
        [];


      dataList.forEach(
        item => {

          if (
            !item ||
            typeof item !==
              "object"
          ) {

            return;

          }


          const produkId =
            String(
              item.produkId ??
              item.idProduk ??
              item.ID_PRODUK ??
              item.ID ??
              ""
            )
            .trim()
            .toUpperCase();


          if (!produkId) {
            return;
          }


          const product =
            productMap.get(
              produkId
            );


          if (!product) {
            return;
          }


          // =================================================
          // PENTING V1.5
          //
          // Backend sudah menghitung minimum per lokasi.
          // Jadi jangan lagi mengambil hanya
          // product.stokMinimum.
          // =================================================

          const minimum =
            Number(
              item.minimum ??
              product.stokMinimum ??
              0
            );


          if (
            minimum <=
            0
          ) {

            return;

          }


          const stok =
            Number(
              item.stok ??
              item.stock ??
              item.STOK ??
              item.qty ??
              item.QTY ??
              0
            );


          if (
            stok >
            minimum
          ) {

            return;

          }


          const lokasiId =
            item.lokasiId ??
            item.idLokasi ??
            item.LOKASI_ID ??
            "";


          const status =
            tentukanStatusStok(
              stok,
              minimum
            );


          perhatian.push({

            produkId:
              produkId,

            nama:
              product.nama ||
              item.nama ||
              produkId,

            lokasi:
              namaLokasi(
                lokasiId
              ),

            lokasiId:
              lokasiId,

            stok:
              stok,

            minimum:
              minimum,

            satuan:
              product.satuan ||
              item.satuan ||
              "",

            status:
              status

          });

        }
      );


      const habis =
        perhatian.filter(
          item =>
            item.status.text ===
            "HABIS"
        );


      const menipis =
        perhatian.filter(
          item =>
            item.status.text ===
            "STOK MENIPIS"
        );


      // =================================================
      // TIDAK ADA MASALAH
      // =================================================

      if (
        perhatian.length ===
        0
      ) {

        box.className =
          "dashboard-stock alert-safe";


        summary.innerHTML = `

          <span
            class="summary-badge summary-safe"
          >
            🟢 AMAN
          </span>

        `;


        content.innerHTML = `

          <div
            class="dashboard-safe-message"
          >
            🟢 STOK TERKENDALI
          </div>

          <div
            class="muted"
            style="margin-top:6px;"
          >
            Tidak ada stok yang berada
            pada atau di bawah batas minimum.
          </div>

        `;


        return;

      }


      // =================================================
      // ADA MASALAH
      // =================================================

      if (
        habis.length >
        0
      ) {

        box.className =
          "dashboard-stock alert-danger";

      } else {

        box.className =
          "dashboard-stock alert-warning";

      }


      summary.innerHTML = `

        <span
          class="summary-badge summary-danger"
        >
          🔴 ${habis.length} Habis
        </span>

        <span
          class="summary-badge summary-warning"
        >
          🟠 ${menipis.length} Menipis
        </span>

      `;


      perhatian.sort(
        (a, b) => {

          if (
            a.status.text ===
              "HABIS" &&
            b.status.text !==
              "HABIS"
          ) {

            return -1;

          }


          if (
            a.status.text !==
              "HABIS" &&
            b.status.text ===
              "HABIS"
          ) {

            return 1;

          }


          return (
            (
              a.stok -
              a.minimum
            ) -
            (
              b.stok -
              b.minimum
            )
          );

        }
      );


      const rows =
        perhatian
          .map(
            item => {

              return `

                <tr>

                  <td>

                    <strong>
                      ${escapeHtml(
                        item.nama
                      )}
                    </strong>

                    <div class="muted">
                      ${escapeHtml(
                        item.produkId
                      )}
                    </div>

                  </td>


                  <td>
                    ${escapeHtml(
                      item.lokasi
                    )}
                  </td>


                  <td>

                    <strong>
                      ${escapeHtml(
                        formatNumber(
                          item.stok
                        )
                      )}
                    </strong>

                    ${escapeHtml(
                      item.satuan
                    )}

                  </td>


                  <td>

                    ${escapeHtml(
                      formatNumber(
                        item.minimum
                      )
                    )}

                    ${escapeHtml(
                      item.satuan
                    )}

                  </td>


                  <td>

                    <span
                      class="stock-status-badge ${item.status.className}"
                    >
                      ${item.status.icon}
                      ${item.status.text}
                    </span>

                  </td>

                </tr>

              `;

            }
          )
          .join("");


      content.innerHTML = `

        <div
          style="
            margin-bottom:12px;
            font-size:14px;
            font-weight:bold;
          "
        >
          ⚠️ ${perhatian.length}
          posisi stok membutuhkan perhatian.
        </div>


        <div
          class="stock-warning-table-wrap"
        >

          <table
            class="stock-warning-table"
          >

            <thead>

              <tr>

                <th>
                  Produk
                </th>

                <th>
                  Lokasi
                </th>

                <th>
                  Stok
                </th>

                <th>
                  Minimum
                </th>

                <th>
                  Kondisi
                </th>

              </tr>

            </thead>


            <tbody>
              ${rows}
            </tbody>

          </table>

        </div>

      `;


    } catch (error) {

      box.className =
        "dashboard-stock";


      summary.innerHTML =
        "";


      content.innerHTML = `

        <div
          class="dashboard-error"
        >
          ⚠️ Peringatan stok belum
          dapat dimuat.
        </div>

        <div
          class="muted"
          style="margin-top:5px;"
        >
          Silakan buka kembali Dashboard
          untuk mencoba lagi.
        </div>

      `;

    } finally {

      dashboardStockLoading =
        false;

    }

  }


  // =====================================================
  // CEK BACKEND
  // =====================================================

  async function cekBackend() {

    const statusElement =
      document.getElementById(
        "backendStatus"
      );


    if (!statusElement) {
      return;
    }


    statusElement.textContent =
      "Checking...";


    try {

      const response =
        await fetch(
          API_URL,
          {
            method:
              "GET",

            cache:
              "no-store"
          }
        );


      if (
        !response.ok
      ) {

        statusElement.textContent =
          "ERROR";

        return;

      }


      const text =
        await response.text();


      let data;


      try {

        data =
          JSON.parse(
            text
          );

      } catch (error) {

        statusElement.textContent =
          "ERROR";

        return;

      }


      if (
        data &&
        data.success ===
          true
      ) {

        statusElement.textContent =
          "ONLINE";

      } else {

        statusElement.textContent =
          "ERROR";

      }


    } catch (error) {

      statusElement.textContent =
        "OFFLINE";

    }

  }


  // =====================================================
  // START
  // =====================================================

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      cekBackend();


      loadProduk()
        .catch(
          function() {
            // Error akan ditampilkan
            // ketika product picker digunakan.
          }
        );


      loadDashboardStock();

    }
  );


</script>
